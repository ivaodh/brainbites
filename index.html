<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>BrainBits — Daily Mind Fuel</title>
    
    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#121417" id="theme-color-meta" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BrainBits" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Google Fonts: Inter & Newsreader -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500;1,6..72,600&display=swap" rel="stylesheet" />

    <!-- Inline Script to prevent Theme FOUC -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('brainbits_theme');
          const isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.querySelector('#theme-color-meta').setAttribute('content', '#121417');
          } else {
            document.documentElement.classList.remove('dark');
            document.querySelector('#theme-color-meta').setAttribute('content', '#F9F9FB');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-paper-light dark:bg-paper-dark text-ink-light dark:text-ink-dark antialiased select-none overflow-hidden h-screen w-screen m-0 p-0">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register Service Worker for Offline PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
